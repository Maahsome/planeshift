components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by a previous paginated response.
      schema:
        type: string
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of results per page; Plane documents a maximum of 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated response fields.
      schema:
        type: string
    Expand:
      name: expand
      in: query
      required: false
      description: Comma-separated related resources to expand.
      schema:
        type: string
  schemas:
    JsonObject:
      type: object
      description: Permissive resource object; refine it when a test needs field-level validation.
      additionalProperties: true
      example:
        id: 00000000-0000-0000-0000-000000000001
        name: Prism example
    JsonValue:
      description: Permissive request payload used until a resource schema is needed by a test.
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/JsonObject'
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
    PaginatedJson:
      type: object
      required:
        - results
      properties:
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        next_page_results:
          type: boolean
        prev_page_results:
          type: boolean
        count:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
        extra_stats:
          type: object
          additionalProperties: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
      example:
        next_cursor: '100:1:0'
        prev_cursor: ''
        next_page_results: false
        prev_page_results: false
        count: 1
        total_pages: 1
        total_results: 1
        extra_stats: {}
        results:
          - id: 00000000-0000-0000-0000-000000000001
            name: Prism example
    ErrorObject:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        detail:
          type: string
        message:
          type: string
    Binary:
      type: string
      format: binary
  responses:
    Json:
      description: JSON resource response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    PaginatedJson:
      description: Cursor-paginated JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedJson'
    NoContent:
      description: The operation completed successfully without a response body.
    Download:
      description: Presigned or binary download response.
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/Binary'
    Error:
      description: Plane error response.
