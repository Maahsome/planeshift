    A local contract for mocking and validating the Plane REST API with Prism.
    The documented API uses /api/v1 paths, JSON payloads, cursor pagination, and
    either X-API-Key or OAuth bearer authentication. This file is intentionally
    permissive for resource payloads because no downloadable official OAS file is
    published; the documented method/path surface remains explicit below.
    Official documentation: https://developers.plane.so/api-reference/introduction
  contact:
    name: Plane
    url: https://plane.so
servers:
  - url: https://api.plane.so
    description: Plane Cloud
  - url: http://localhost:4010
    description: Local Prism mock
